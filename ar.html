<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROA-AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    .a-enter-vr { display: none !important; }

    #mulai {
      position: fixed; inset: 0; z-index: 10000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(20, 20, 40, 0.92); padding: 24px;
    }
    #mulai .kartu {
      max-width: 340px; text-align: center; color: #fff;
    }
    #mulai h1 { margin: 0 0 12px; font-size: 28px; }
    #mulai p  { margin: 0 0 24px; line-height: 1.5; }
    #btnMulai {
      font-size: 18px; padding: 14px 40px; border: 0; border-radius: 999px;
      background: #ffb300; color: #222; font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Layar sambutan: ketukan pertama membuka kunci audio di browser HP -->
  <div id="mulai">
    <div class="kartu">
      <h1>ROA-AR</h1>
      <p>Ketuk <b>Mulai</b>, lalu arahkan kamera ke poster atau kartu. Nyalakan suara HP-mu.</p>
      <button id="btnMulai">Mulai</button>
    </div>
  </div>

  <audio id="narasi" src="./assets/narasi.wav" preload="auto"></audio>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-gltf-model
        src="./assets/robocat.glb"
        position="0 0.1 0"
        rotation="0 0 0"
        scale="0.3 0.3 0.3">
      </a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    const audio = document.getElementById('narasi');
    const target = document.getElementById('target');
    let siap = false;

    // Ketukan "Mulai" membuka kunci audio
    document.getElementById('btnMulai').addEventListener('click', () => {
      audio.play()
        .then(() => { audio.pause(); audio.currentTime = 0; siap = true; })
        .catch((e) => console.warn('Audio belum bisa dibuka:', e));
      document.getElementById('mulai').style.display = 'none';
    });

    // Poster terdeteksi: putar narasi dari awal
    target.addEventListener('targetFound', () => {
      if (!siap) return;
      audio.currentTime = 0;
      audio.play().catch((e) => console.warn('Gagal memutar:', e));
    });

    // Poster hilang: hentikan narasi
    target.addEventListener('targetLost', () => {
      audio.pause();
      audio.currentTime = 0;
    });
  </script>
</body>
</html>
