<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROA-AR Tes</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; }
  </style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <!-- panel transparan seukuran gambar (rasio 1000x700 = 1 : 0,7) -->
      <a-plane color="#2196f3" opacity="0.4" width="1" height="0.7"></a-plane>
      <!-- kotak merah yang melayang di atas gambar -->
      <a-box position="0 0 0.15" scale="0.2 0.2 0.2" color="#e53935"></a-box>
    </a-entity>
  </a-scene>
</body>
</html>
