<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROA-AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    .a-enter-vr { display: none !important; }
  </style>

  <script>
    // Menyembunyikan alas datar yang ikut tersimpan di model (tebakan otomatis)
    AFRAME.registerComponent('hide-base', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const root = this.el.getObject3D('mesh');
          if (!root) return;
          root.updateWorldMatrix(true, true);
          const total = new THREE.Box3().setFromObject(root);
          const ts = new THREE.Vector3();
          total.getSize(ts);
          root.traverse((o) => {
            if (!o.isMesh) return;
            const b = new THREE.Box3().setFromObject(o);
            const s = new THREE.Vector3();
            b.getSize(s);
            // mesh yang sangat tipis tapi lebar = alas
            if (s.y < ts.y * 0.1 && s.x > ts.x * 0.6 && s.z > ts.z * 0.6) {
              o.visible = false;
            }
          });
        });
      }
    });
  </script>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model
        src="./assets/robocat.glb"
        hide-base
        position="0 -0.2 0"
        rotation="0 0 0"
        scale="0.3 0.3 0.3">
      </a-gltf-model>
    </a-entity>
  </a-scene>
</body>
</html>
